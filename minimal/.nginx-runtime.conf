# 最小化单点部署 - Nginx 配置
# 用法: sudo nginx -c $PROJECT_ROOT/minimal/nginx.conf

worker_processes 1;

events {
    worker_connections 64;
}

http {
    # mime.types 路径（macOS Homebrew / Linux 自动检测）
    # 如果启动失败，请检查 mime.types 实际路径并修改下方 include
    include /opt/homebrew/etc/nginx/mime.types;
    # 备选路径（取消注释使用）:
    # include /usr/local/etc/nginx/mime.types;
    # include /etc/nginx/mime.types;
    
    default_type application/octet-stream;

    # 日志（写入 minimal 同级 logs 目录）
    access_log /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-access.log;
    error_log /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-error.log;

    # 临时目录（避免使用 /tmp）
    client_body_temp_path /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-client-body;
    proxy_temp_path /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-proxy;
    fastcgi_temp_path /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-fastcgi;
    uwsgi_temp_path /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-uwsgi;
    scgi_temp_path /Users/xujingwei/kiro/data-pipeline/logs/minimal/nginx-scgi;

    server {
        listen 8888;
        server_name localhost;

        # 前端静态文件目录
        root /Users/xujingwei/kiro/data-pipeline/monitor/frontend-vue/dist;
        index index.html;

        # gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript 
                   application/x-javascript application/xml+rss 
                   application/javascript application/json;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 代理到后端
        location /api {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # CORS 头部
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Actuator 健康检查代理
        location /actuator {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SSE 实时数据流 - 长连接配置
        location /api/cdc/events/stream {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            
            # SSE 关键配置
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            # 长连接超时（24小时）
            proxy_connect_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            
            gzip off;
        }

        # Vue Router History 模式支持
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 安全头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 错误页面
        error_page 404 /index.html;
    }
}
