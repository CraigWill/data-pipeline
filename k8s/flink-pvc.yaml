apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-checkpoints-pvc
  namespace: flink
spec:
  accessModes:
  - ReadWriteOnce   # local-path provisioner 仅支持 RWO；生产 NFS 环境改为 ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  # storageClassName: nfs-client  # NFS/Ceph 等共享存储时取消注释
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-savepoints-pvc
  namespace: flink
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-ha-pvc
  namespace: flink
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: nfs-client
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-output-pvc
  namespace: flink
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: nfs-client
