apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-backend
  namespace: flink
spec:
  replicas: 2  # 高可用：2个实例
  selector:
    matchLabels:
      app: monitor-backend
  template:
    metadata:
      labels:
        app: monitor-backend
    spec:
      containers:
      - name: monitor-backend
        image: monitor-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
          name: http
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 5001
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 5001
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        env:
        - name: FLINK_REST_URL
          value: "http://flink-jobmanager:8081"
        - name: FLINK_REST_URLS
          value: "http://flink-jobmanager:8081"
        # OceanBase observer 注册地址（libobcdc rsList 用 IP，不能用 hostname）
        - name: OB_RS_HOST
          value: "172.22.0.2"
        - name: OBLOGPROXY_HOST
          value: "obbinlog"
        - name: OBLOGPROXY_PORT
          value: "2983"
        # ── OSS 对象存储（作业输出/位点/CSV 均走 OSS，不再使用 PVC）──────
        - name: OSS_ENABLED
          value: "true"
        - name: OSS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-endpoint
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-access-key-id
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-access-key-secret
        - name: OSS_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-bucket
        - name: OSS_PREFIX
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-prefix
        # 提交 CDC 作业时下发给 Flink 的输出/状态目录（均为 OSS）
        - name: OUTPUT_PATH
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)cdc"
        - name: FLINK_OUTPUT_PATH
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)cdc"
        - name: FLINK_CHECKPOINT_DIR
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)flink/checkpoints"
        - name: FLINK_SAVEPOINT_DIR
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)flink/savepoints"
        - name: CONFIG_DIR
          value: "/app/config"
        - name: LOG_FILE
          value: "/app/out/monitor-backend.log"
        # ── CDC 管理库配置（OceanBase，MySQL 兼容协议，存储元数据表）──
        - name: CDC_ADMIN_TYPE
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: cdc-admin-type
        - name: CDC_ADMIN_HOST
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: cdc-admin-host
        - name: CDC_ADMIN_PORT
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: cdc-admin-port
        - name: CDC_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: cdc-admin-username
        - name: CDC_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: cdc-admin-password
        - name: CDC_ADMIN_DATABASE
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: cdc-admin-database
        - name: TZ
          value: "Asia/Shanghai"
        # JWT 安全配置
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: jwt-secret
        - name: JWT_EXPIRATION
          value: "86400000"
        # AES 密码加密配置
        - name: AES_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: aes-encryption-key
        # 管理员初始密码
        - name: ADMIN_INITIAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: admin-initial-password
        # CORS 配置
        - name: ALLOWED_ORIGINS
          value: "http://monitor-frontend:80,http://localhost:3000,http://localhost:8888,https://datapipeline.aimachine-tech.cn"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: out
          mountPath: /app/out
      volumes:
      # 输出改为 OSS，不再挂载 flink-output-pvc
      - name: config
        emptyDir: {}
      - name: out
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-backend
  namespace: flink
spec:
  type: NodePort
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 30501   # Backend API：http://localhost:30501
    name: http
  selector:
    app: monitor-backend
