# Docker / K8s 容器环境配置
# 激活方式: -Dspring.profiles.active=docker（Dockerfile 中已写死）
# 说明：datasource 连接由 DataSourceConfig.java 通过 CDC_ADMIN_* 环境变量动态构建，
#       此处不再声明 spring.datasource.url，避免与 DataSourceConfig Bean 冲突。

server:
  port: 5001

spring:
  application:
    name: realtime-data-pipeline

# Flink REST API 地址（由环境变量注入）
flink:
  rest:
    url: ${FLINK_REST_URL:http://localhost:8081}
  rest-urls: ${FLINK_REST_URLS:}

# CDC 输出路径（由环境变量注入）
output:
  path: ${OUTPUT_PATH:./output/cdc}

# 配置目录
config:
  dir: ${CONFIG_DIR:./config}

# 日志配置（控制台 + 文件；文件落在容器 /app/out）
logging:
  level:
    root: INFO
    com.realtime: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/app/out/monitor-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB

# Actuator 端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
