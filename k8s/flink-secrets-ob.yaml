apiVersion: v1
kind: Secret
metadata:
  name: flink-secrets-ob
  namespace: flink
type: Opaque
stringData:
  # ── OceanBase 数据库连接配置 ──────────────────────────────────────
  # 用于 Flink CDC 任务连接 OceanBase 业务库
  ob-host: "172.17.0.1"
  ob-port: "2881"
  ob-username: "root@test_tenant"   # 格式: 用户名@租户名
  ob-password: "your-ob-password-here"
  ob-database: "test_schema"        # 数据库名（OceanBase 使用 database 而非 SID）
  ob-schema: "test_schema"          # 要监控的 Schema
