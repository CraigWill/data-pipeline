# Monitor Backend 配置文件
# 说明：大部分运行时参数通过环境变量注入（见 docker-compose.yml / k8s/flink-secrets.yaml）
# 本文件只保留 Spring Boot 框架级配置和必须在 yml 中声明的占位符绑定

spring:
  main:
    # 允许循环引用（Spring Security 配置需要）
    allow-circular-references: true

  session:
    cookie:
      http-only: true
      secure: false   # 生产 HTTPS 环境改为 true
      same-site: lax

  # CDC 管理库连接池（url/username/password/driver 由 DataSourceConfig.java 动态构建）
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# JWT 配置（值来自环境变量，此处声明占位符）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

# 管理员初始密码（值来自环境变量）
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD}

# 阿里云 OSS 配置（值来自环境变量，默认关闭）
oss:
  enabled: ${OSS_ENABLED:false}
  endpoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  prefix: ${OSS_PREFIX:data-pipeline/}
