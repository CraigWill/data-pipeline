apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  replicas: 1  # RWO PVC 不支持多副本共享；生产 NFS/Ceph 环境可改为 2 启用 HA
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      serviceAccountName: flink
      containers:
      - name: jobmanager
        image: flink-jobmanager:latest
        imagePullPolicy: IfNotPresent
        args: ["jobmanager"]
        ports:
        - containerPort: 6123
          name: rpc
        - containerPort: 6124
          name: blob-server
        - containerPort: 8081
          name: webui
        livenessProbe:
          httpGet:
            path: /overview
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /overview
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        env:
        - name: JOB_MANAGER_RPC_ADDRESS
          value: "flink-jobmanager"
        - name: JOB_MANAGER_RPC_PORT
          value: "6123"
        - name: JOB_MANAGER_HEAP_SIZE
          value: "1024m"
        - name: REST_PORT
          value: "8081"
        - name: PARALLELISM_DEFAULT
          value: "4"
        - name: CHECKPOINT_INTERVAL
          value: "300000"
        # ── OSS 对象存储凭证（checkpoint/savepoint/CSV 直写 OSS）──────────
        # 必须定义在下方 *_DIR 之前，供 $(VAR) 展开使用
        - name: OSS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-endpoint
        - name: OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-access-key-id
        - name: OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-access-key-secret
        - name: OSS_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-bucket
        - name: OSS_PREFIX
          valueFrom:
            secretKeyRef:
              name: flink-secrets
              key: oss-prefix
        # ── 状态/输出目录：全部指向 OSS，不再使用 PVC ──────────────────
        - name: CHECKPOINT_DIR
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)flink/checkpoints"
        - name: SAVEPOINT_DIR
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)flink/savepoints"
        - name: STATE_BACKEND
          value: "hashmap"
        # Kubernetes HA 配置（HA 存储同样落 OSS）
        - name: HA_MODE
          value: "kubernetes"
        - name: HA_STORAGE_DIR
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)flink/ha"
        - name: OUTPUT_PATH
          value: "oss://$(OSS_BUCKET_NAME)/$(OSS_PREFIX)cdc"
        - name: TZ
          value: "Asia/Shanghai"
        - name: AUTO_SUBMIT_JOB
          value: "false"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: flink-config-volume
          mountPath: /opt/flink/conf
        - name: flink-logs
          mountPath: /opt/flink/logs
      volumes:
      - name: flink-config-volume
        configMap:
          name: flink-config
          items:
          - key: flink-conf.yaml
            path: flink-conf.yaml
          - key: log4j-console.properties
            path: log4j-console.properties
      # checkpoint / savepoint / ha 已改为 OSS 存储，不再需要 PVC
      - name: flink-logs
        emptyDir: {}
